name: Release MonyaCode

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.1)
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  preflight:
    name: Preflight source and build dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld pkg-config libglib2.0-dev libgtk-3-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libatk1.0-dev libcairo2-dev libx11-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libasound2-dev
      - name: Check dependency metadata
        run: cargo metadata --locked --no-deps
      - name: Check MonyaCode and CLI
        run: cargo check --release --package monyacode --package cli --target x86_64-unknown-linux-gnu

  macos:
    needs: preflight
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-14
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ matrix.target }}
      - name: Check macOS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          clang --version
          cargo metadata --locked --no-deps >/dev/null
      - name: Build MonyaCode
        run: cargo build --release --package monyacode --package cli --target ${{ matrix.target }}
      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          root="target/${{ matrix.target }}/release"
          app="$root/MonyaCode.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 0755 "$root/monyacode" "$app/Contents/MacOS/MonyaCode"
          install -m 0755 "$root/cli" "$app/Contents/MacOS/cli"
          install -m 0644 crates/monyacode/resources/app-icon@2x.png "$app/Contents/Resources/MonyaCode.png"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>MonyaCode</string>
          <key>CFBundleDisplayName</key><string>MonyaCode</string>
          <key>CFBundleExecutable</key><string>MonyaCode</string>
          <key>CFBundleIdentifier</key><string>app.monyacode.MonyaCode</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>MonyaCode.png</string>
          <key>CFBundleShortVersionString</key><string>$version</string>
          <key>CFBundleVersion</key><string>$version</string>
          <key>LSMinimumSystemVersion</key><string>10.15.7</string>
          <key>CFBundleURLTypes</key><array><dict><key>CFBundleURLSchemes</key><array><string>monyacode</string></array></dict></array>
          </dict></plist>
          PLIST
          ditto -c -k --sequesterRsrc --keepParent "$app" "MonyaCode-${version}-macos-${{ matrix.arch }}.zip"
      - name: Verify macOS package
        run: unzip -t "MonyaCode-${RELEASE_VERSION#v}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MonyaCode-${{ env.RELEASE_VERSION }}-macos-${{ matrix.arch }}
          path: MonyaCode-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux:
    needs: preflight
    name: Linux ${{ matrix.arch }} DEB
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.target }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld dpkg-dev pkg-config libglib2.0-dev libgtk-3-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libatk1.0-dev libcairo2-dev libx11-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libfontconfig1-dev libasound2-dev
      - name: Check Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          pkg-config --exists glib-2.0 gtk+-3.0 gdk-3.0 pango atk cairo x11 wayland-client xkbcommon xkbcommon-x11 libudev fontconfig alsa
          cargo metadata --locked --no-deps >/dev/null
      - name: Build MonyaCode
        run: cargo build --release --package monyacode --package cli --target ${{ matrix.target }}
      - name: Verify binary architecture
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/monyacode"
          file "$binary"
          case "${{ matrix.arch }}" in
            amd64) file "$binary" | grep -Eq 'x86-64|x86_64' ;;
            arm64) file "$binary" | grep -Eq 'ARM aarch64|ARM64' ;;
          esac
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          package="monyacode_${version}_${{ matrix.arch }}"
          root="target/${{ matrix.target }}/release"
          mkdir -p "$package/DEBIAN" "$package/usr/bin" "$package/usr/libexec" "$package/usr/share/applications" "$package/usr/share/icons/hicolor/512x512/apps" "$package/usr/share/doc/monyacode"
          install -m 0755 "$root/monyacode" "$package/usr/libexec/monyacode-editor"
          install -m 0755 "$root/cli" "$package/usr/bin/monyacode"
          install -m 0644 crates/monyacode/resources/app-icon.png "$package/usr/share/icons/hicolor/512x512/apps/monyacode.png"
          sed 's/^Icon=.*/Icon=monyacode/; s/^Exec=.*/Exec=monyacode %U/' crates/monyacode/resources/monyacode.desktop.in | sed 's/\$APP_NAME/MonyaCode/g; s/\$APP_CLI/monyacode/g; s/\$APP_ARGS/%U/g; s/\$APP_ICON/monyacode/g' > "$package/usr/share/applications/monyacode.desktop"
          install -m 0644 LICENSE-GPL "$package/usr/share/doc/monyacode/copyright"
          cat > "$package/DEBIAN/control" <<CONTROL
          Package: monyacode
          Version: $version
          Section: editors
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: MonyaCode contributors
          Description: MonyaCode native code editor
           A fast, focused Rust code editor and IDE.
          CONTROL
          dpkg-deb --build --root-owner-group "$package" "MonyaCode-${version}-linux-${{ matrix.arch }}.deb"
          dpkg-deb --info "MonyaCode-${version}-linux-${{ matrix.arch }}.deb"
          dpkg-deb --contents "MonyaCode-${version}-linux-${{ matrix.arch }}.deb" | grep -q 'monyacode-editor'
      - uses: actions/upload-artifact@v4
        with:
          name: MonyaCode-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}
          path: MonyaCode-*.deb
          if-no-files-found: error

  windows:
    needs: preflight
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Locate DirectX shader compiler
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem -Path $sdkBin -Filter fxc.exe -Recurse | Where-Object { $_.FullName -like '*\x64\fxc.exe' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check Windows build dependencies
        shell: pwsh
        run: cargo metadata --locked --no-deps
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-x86_64
      - name: Build MonyaCode
        run: cargo build --release --package monyacode --package cli
      - name: Package Windows build
        shell: pwsh
        run: |
          $version = "${env:RELEASE_VERSION}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/release/monyacode.exe package/MonyaCode.exe
          Copy-Item target/release/cli.exe package/monyacode-cli.exe
          Copy-Item LICENSE-GPL package/LICENSE-GPL
          Compress-Archive -Path package/* -DestinationPath "MonyaCode-$version-windows-x86_64.zip"
          Expand-Archive -LiteralPath "MonyaCode-$version-windows-x86_64.zip" -DestinationPath verify -Force
          if (-not (Test-Path verify/MonyaCode.exe)) { throw 'Windows editor package verification failed' }
          if (-not (Test-Path verify/monyacode-cli.exe)) { throw 'Windows CLI package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: MonyaCode-${{ env.RELEASE_VERSION }}-windows-x86_64
          path: MonyaCode-*.zip
          if-no-files-found: error

  validate-artifacts:
    name: Validate release artifacts
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: MonyaCode-*
          merge-multiple: true
      - name: Validate all target artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          expected=(
            "artifacts/MonyaCode-${version}-macos-arm64.zip"
            "artifacts/MonyaCode-${version}-macos-x86_64.zip"
            "artifacts/MonyaCode-${version}-linux-arm64.deb"
            "artifacts/MonyaCode-${version}-linux-amd64.deb"
            "artifacts/MonyaCode-${version}-windows-x86_64.zip"
          )
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
            case "$artifact" in
              *.zip) unzip -t "$artifact" >/dev/null ;;
              *.deb) dpkg-deb --info "$artifact" >/dev/null ;;
            esac
          done
          printf 'Validated %s release artifacts.\n' "${#expected[@]}"

  publish:
    name: Publish GitHub release
    needs: validate-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: MonyaCode-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION#v}"
          tag="v$version"
          gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --title "MonyaCode $version" --generate-notes
